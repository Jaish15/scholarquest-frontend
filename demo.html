  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
    /* Set custom scrollbar for retro look */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #09090b;
    }
    ::-webkit-scrollbar-thumb {
      background: #451a03;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #78350f;
    }

    /* Sprite Crop & Scale Styles */
    .sprite-container {
      width: 48px !important;
      height: 48px !important;
      position: relative !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .sprite-image {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: auto !important;
      height: auto !important;
      max-width: none !important;
      image-rendering: pixelated !important;
      transform: scale(1.5) !important;
      transform-origin: top left !important;
    }

    .sprite-preview-container {
      width: 96px !important;
      height: 96px !important;
      position: relative !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .sprite-preview-image {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: auto !important;
      height: auto !important;
      max-width: none !important;
      image-rendering: pixelated !important;
      transform: scale(3) !important;
      transform-origin: top left !important;
    }

    /* Avatar selection card button overrides */
    .avatar-grid-btn {
      position: relative !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 12px !important;
      border-radius: var(--radius-md) !important;
      border: 1px solid rgba(245, 158, 11, 0.15) !important;
      background-color: rgba(20, 18, 15, 0.6) !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      cursor: pointer !important;
      outline: none !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .avatar-grid-btn:hover:not(:disabled) {
      border-color: #d97706 !important;
      background-color: rgba(30, 27, 22, 0.8) !important;
      transform: translateY(-2px) !important;
    }

    .avatar-grid-btn.selected {
      background-color: rgba(120, 53, 15, 0.25) !important;
      border-color: #f59e0b !important;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.25) !important;
    }

    .avatar-grid-btn:disabled {
      background-color: rgba(9, 9, 11, 0.2) !important;
      border-color: rgba(63, 63, 70, 0.2) !important;
      cursor: not-allowed !important;
    }
  </style>
</head>

        tier: 'Level Reward',
        unlockType: 'level',
        unlockValue: 14,
        description: 'Honored academician who defends standard protocols.',
      }
    ];

    const checkUnlock = (character, stats) => {
      const {
        level = 1,
        golds = 0,
        habitStreakPoints = 0,
        focusPoints = 0,
        studySyncStatus = 'disconnected'
      } = stats;

      switch (character.unlockType) {
        case 'default':
          return { unlocked: true, reason: 'Starter Avatar' };
        case 'level':
          return {
            unlocked: level >= character.unlockValue,
            reason: `Requires Level ${character.unlockValue} (Current: ${level})`
          };
        case 'gold':
          return {
            unlocked: golds >= character.unlockValue,
            reason: `Requires ${character.unlockValue} Gold Coins (Current: ${golds})`
          };
        case 'habit':
          return {
            unlocked: habitStreakPoints >= character.unlockValue,
            reason: `Requires Habit Streak of ${character.unlockValue} (Current: ${habitStreakPoints})`
          };
        case 'focus':
          return {
            unlocked: focusPoints >= character.unlockValue,
            reason: `Requires ${character.unlockValue} Focus Points (Current: ${focusPoints})`
          };
        case 'studysync':
          const isConnected = studySyncStatus === 'connected' || studySyncStatus === 'active' || studySyncStatus === true;
          return {
            unlocked: !!isConnected,
            reason: `Requires active StudySync room connection`
          };
        default:
          return { unlocked: true, reason: '' };
      }
    };

    // React Component code adapted for script tags
    const AvatarSelector = ({
      level = 1,
      golds = 0,
      habitStreakPoints = 0,
      focusPoints = 0,
      studySyncStatus = 'disconnected',
      selectedAvatarId = null,
      onSelect = () => {}
    }) => {
      const currentStats = { level, golds, habitStreakPoints, focusPoints, studySyncStatus };
      
      const [activeTab, setActiveTab] = React.useState('all');
      const [searchQuery, setSearchQuery] = React.useState('');
      const [hoveredCharacter, setHoveredCharacter] = React.useState(null);

      const tabs = [
        { id: 'all', label: 'All Heroes' },
        { id: 'starter', label: 'Starter Pack' },
        { id: 'level', label: 'Level Milestones' },
        { id: 'gold', label: 'Merchant Exchange' },
        { id: 'milestone', label: 'Streaks & Focus' },
        { id: 'misc', label: 'Special Sync' }
      ];

      const filteredCharacters = AVATAR_CHARACTERS.filter(char => {
        const matchesSearch =
          char.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          char.description.toLowerCase().includes(searchQuery.toLowerCase());

        if (!matchesSearch) return false;

        if (activeTab === 'all') return true;
        if (activeTab === 'starter') return char.tier === 'Base Starter';
        if (activeTab === 'level') {
          return char.tier === 'Level Reward' || char.tier === 'Prestige Tier' || char.tier === 'Legendary';
        }
        if (activeTab === 'gold') return char.tier === 'Gold Exchange';
        if (activeTab === 'milestone') {
          return char.tier === 'Habit Milestone' || char.tier === 'Focus Milestone';
        }
        if (activeTab === 'misc') return char.tier === 'StudySync Link';
        return true;
      });

      const activePreviewChar = hoveredCharacter ||
        AVATAR_CHARACTERS.find(c => c.id === selectedAvatarId) ||
        AVATAR_CHARACTERS[0];

      const previewUnlockStatus = activePreviewChar ? checkUnlock(activePreviewChar, currentStats) : { unlocked: true, reason: '' };

      return (
        <div className="flex flex-col lg:flex-row gap-6 p-6 rounded-2xl bg-[#13110e] border border-amber-950/40 text-amber-100/90 shadow-2xl max-w-7xl mx-auto selection:bg-amber-800 selection:text-amber-100">
          
          {/* LEFT AREA: Character Selection Grid */}
          <div className="flex-1 flex flex-col gap-5">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-zinc-950/60 border border-amber-900/10 p-5 rounded-xl">
              <div>
                <h2 className="text-2xl font-extrabold text-amber-400 tracking-wide flex items-center gap-2">
                  🛡️ Scholar Dojo
                </h2>
                <p className="text-xs text-amber-200/50 mt-1">
                  Complete quests, forge habits, and focus to unlock legendary avatars.
                </p>
              </div>
              
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full md:w-auto">
                <div className="flex items-center gap-2 bg-[#1c1914] px-3 py-1.5 rounded-lg border border-amber-950/40" title="Scholar Level">
                  <span className="text-lg">⭐</span>
                  <div className="text-left">
                    <p className="text-[10px] uppercase tracking-wider text-amber-200/40 font-semibold leading-none">Level</p>
                    <p className="text-sm font-bold text-amber-300 leading-none mt-1">{level}</p>
                  </div>
                </div>
                
                <div className="flex items-center gap-2 bg-[#1c1914] px-3 py-1.5 rounded-lg border border-amber-950/40" title="Gold Coins">
                  <span className="text-lg">🪙</span>
                  <div className="text-left">
                    <p className="text-[10px] uppercase tracking-wider text-amber-200/40 font-semibold leading-none">Gold</p>
                    <p className="text-sm font-bold text-yellow-400 leading-none mt-1">{golds}</p>
                  </div>
                </div>

                <div className="flex items-center gap-2 bg-[#1c1914] px-3 py-1.5 rounded-lg border border-amber-950/40" title="Habit Streak (Bricks)">
                  <span className="text-lg">🧱</span>
                  <div className="text-left">
                    <p className="text-[10px] uppercase tracking-wider text-amber-200/40 font-semibold leading-none">Bricks</p>
                    <p className="text-sm font-bold text-red-400 leading-none mt-1">{habitStreakPoints}</p>
                  </div>
                </div>

                <div className="flex items-center gap-2 bg-[#1c1914] px-3 py-1.5 rounded-lg border border-amber-950/40" title="Focus Points (Honey)">
                  <span className="text-lg">🍯</span>
                  <div className="text-left">
                    <p className="text-[10px] uppercase tracking-wider text-amber-200/40 font-semibold leading-none">Honey</p>
                    <p className="text-sm font-bold text-amber-400 leading-none mt-1">{focusPoints}</p>
                  </div>
                </div>
              </div>
            </div>

            <div className="flex flex-col md:flex-row gap-3 items-center justify-between">
              <div className="flex gap-1.5 overflow-x-auto w-full md:w-auto pb-1 md:pb-0">
                {tabs.map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3 py-1.5 text-xs font-medium rounded-lg border whitespace-nowrap transition-all duration-200 ${
                      activeTab === tab.id
                        ? 'bg-amber-700/25 border-amber-500/60 text-amber-200 shadow-md'
                        : 'bg-zinc-950/40 border-amber-950/30 text-amber-100/50 hover:text-amber-100/80 hover:bg-[#1a1713]'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              <div className="relative w-full md:w-64">
                <input
                  type="text"
                  placeholder="Search characters..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-full bg-zinc-950/60 border border-amber-950/40 rounded-lg px-3.5 py-1.5 pl-9 text-xs text-amber-100 focus:outline-none focus:border-amber-500/50 placeholder:text-amber-100/20"
                />
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-amber-100/30">🔍</span>
              </div>
            </div>

            <div className="bg-zinc-950/40 border border-amber-950/30 rounded-xl p-4 min-h-[360px] max-h-[500px] overflow-y-auto">
              {filteredCharacters.length > 0 ? (
                <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 xl:grid-cols-6 gap-3.5">

                    const { unlocked, reason } = checkUnlock(char, currentStats);
                    const isSelected = char.id === selectedAvatarId;

                    return (
                      <button
                        key={char.id}
                        onClick={() => unlocked && onSelect(char.id)}
                        onMouseEnter={() => setHoveredCharacter(char)}
                        onMouseLeave={() => setHoveredCharacter(null)}
                        disabled={!unlocked}
                        className={`avatar-grid-btn ${isSelected ? 'selected' : ''}`}
                      >
                        <div 
                          className={`sprite-container ${
                            !unlocked ? 'opacity-40 grayscale contrast-75 brightness-75' : ''
                          }`}
                        >
                          <img
                            src={char.sprite}
                            alt={char.name}
                            className="sprite-image"
                          />
                        </div>

                        <span 
                          className={`text-[10px] font-bold text-center mt-2.5 tracking-wider truncate w-full ${
                            isSelected ? 'text-amber-300' : unlocked ? 'text-amber-100/70' : 'text-zinc-600'
                          }`}
                        >
                          {char.name}
                        </span>

                        {!unlocked && (
                          <>
                            <div className="absolute top-1.5 right-1.5 bg-black/80 px-1 py-0.5 border border-zinc-800 rounded-md text-[8px] font-bold text-zinc-500">
                              🔒
                            </div>
                            
                            <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 hidden group-hover:block z-50 bg-zinc-950 border border-amber-900/30 text-amber-200/90 text-[10px] font-medium rounded-lg py-1.5 px-2.5 w-36 shadow-xl text-center pointer-events-none">
                              <p className="font-semibold text-red-400">Locked</p>
                              <p className="mt-0.5 text-zinc-400 leading-tight">{reason}</p>
                              <div className="w-1.5 h-1.5 bg-zinc-950 border-b border-r border-amber-900/30 transform rotate-45 absolute top-full left-1/2 -translate-x-1/2 -translate-y-1"></div>
                            </div>
                          </>
                        )}

                        {unlocked && isSelected && (
                          <div className="absolute top-1.5 right-1.5 bg-amber-500/10 px-1 py-0.5 border border-amber-500/40 rounded-md text-[8px] font-bold text-amber-400">
                            ✔️
                          </div>
                        )}
                      </button>
                    );
                  })}
                </div>
              ) : (
                <div className="flex flex-col items-center justify-center py-16 text-center">
                  <span className="text-3xl mb-2">🔍</span>
                  <p className="text-xs font-semibold text-amber-200/30">No matching characters found.</p>
                </div>
              )}
            </div>
          </div>

          {/* RIGHT AREA: Character Details Card / Sidebar */}
          <div className="w-full lg:w-80 bg-zinc-950/60 border border-amber-950/30 rounded-xl p-5 flex flex-col justify-between shadow-lg">
            {activePreviewChar ? (
              <div className="flex flex-col h-full justify-between gap-6">
                <div className="text-center">
                  <div className="inline-block bg-amber-950/20 border border-amber-900/30 px-2.5 py-1 rounded-full text-[9px] font-extrabold uppercase tracking-widest text-amber-400">
                    {activePreviewChar.tier}
                  </div>
                  <h3 className="text-xl font-extrabold text-amber-200 mt-2 tracking-wide font-serif">
                    {activePreviewChar.name}
                  </h3>
                  <p className="text-[10px] text-amber-200/40 uppercase tracking-widest mt-0.5 font-bold">
                    {activePreviewChar.pack}
                  </p>
                </div>

                <div className="flex items-center justify-center py-6 bg-gradient-to-b from-[#181512]/50 to-[#221c17]/30 border border-amber-950/20 rounded-xl relative overflow-hidden group shadow-inner">
                  <div 
                    className={`sprite-preview-container transition-transform duration-300 group-hover:scale-110 ${
                      !previewUnlockStatus.unlocked ? 'grayscale contrast-50 brightness-50 opacity-40' : ''
                    }`}
                  >
                    <img
                      src={activePreviewChar.sprite}
                      alt={activePreviewChar.name}
                      className="sprite-preview-image"
                    />
                  </div>

                  {!previewUnlockStatus.unlocked && (
                    <div className="absolute inset-0 flex flex-col items-center justify-center bg-[#0d0a08]/40">
                      <div className="bg-zinc-950 p-2 border border-zinc-800 rounded-full text-zinc-500 shadow-xl">
                        🔒
                      </div>
                    </div>
                  )}
                </div>

                <div className="space-y-4 flex-1 flex flex-col justify-center">
                  <div>
                    <p className="text-[10px] text-amber-200/35 uppercase font-bold tracking-widest mb-1.5 text-left">Description</p>
                    <p className="text-xs text-amber-100/70 leading-relaxed text-left bg-zinc-900/40 p-3 rounded-lg border border-amber-950/10 italic">
                      "{activePreviewChar.description}"
                    </p>
                  </div>

                  <div className="bg-[#1a1612]/60 border border-amber-950/20 p-3 rounded-lg text-left">
                    <p className="text-[10px] text-amber-200/35 uppercase font-bold tracking-widest mb-1">Unlock Rule</p>
                    {previewUnlockStatus.unlocked ? (
                      <div className="flex items-center gap-1.5 mt-1.5">
                        <span className="text-green-500">✔️</span>
                        <span className="text-[11px] font-bold text-green-400 uppercase tracking-wider">Unlocked & Ready</span>
                      </div>
                    ) : (
                      <div>
                        <p className="text-xs text-red-400 font-semibold mt-1">⚠️ Locked</p>
                        <p className="text-[10px] text-amber-100/60 mt-1 leading-relaxed">{previewUnlockStatus.reason}</p>
                      </div>
                    )}
                  </div>
                </div>

                <div className="mt-4">
                  {previewUnlockStatus.unlocked ? (
                    <button
                      onClick={() => onSelect(activePreviewChar.id)}
                      disabled={activePreviewChar.id === selectedAvatarId}
                      className={`w-full py-2.5 px-4 rounded-lg font-bold text-xs uppercase tracking-wider transition-all duration-300 ${
                        activePreviewChar.id === selectedAvatarId
                          ? 'bg-amber-950/25 text-amber-500 border border-amber-900/40 cursor-default'
                          : 'bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-zinc-950 shadow-md border border-amber-500/25 active:translate-y-0.5'
                      }`}
                    >
                      {activePreviewChar.id === selectedAvatarId ? 'Currently Equipped' : 'Equip Character'}
                    </button>
                  ) : (
                    <button
                      disabled
                      className="w-full py-2.5 px-4 rounded-lg font-bold text-xs uppercase tracking-wider bg-zinc-900 text-zinc-600 border border-zinc-950 cursor-not-allowed"
                    >
                      Locked
                    </button>
                  )}
                </div>
              </div>
            ) : (
              <div className="flex flex-col items-center justify-center h-full py-12 text-zinc-500">
                <span className="text-2xl mb-1">🛡️</span>
                <p className="text-xs font-semibold">Hover over a hero to inspect details.</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    // Root component hosting the state controls for user testing
    const DemoApp = () => {
      const [level, setLevel] = React.useState(5);
      const [golds, setGolds] = React.useState(180);
      const [bricks, setBricks] = React.useState(4);
      const [honey, setHoney] = React.useState(60);
      const [studySync, setStudySync] = React.useState('connected');
      const [selectedAvatarId, setSelectedAvatarId] = React.useState('peasant');

      return (
        <div className="flex flex-col gap-6">
          <div className="bg-[#161411] border border-amber-950/40 p-6 rounded-2xl shadow-xl max-w-7xl mx-auto w-full">
            <h1 className="text-3xl font-extrabold text-amber-400 font-serif tracking-wider text-center">
              🎓⚔️ ScholarQuest Avatar Dojo
            </h1>
            <p className="text-xs text-amber-200/50 text-center mt-1">
              Interactive Test Environment - Slide values to lock or unlock character sprites in real-time!
            </p>

            {/* Simulated Live User Controls */}
            <div className="grid grid-cols-1 md:grid-cols-5 gap-6 mt-6 p-4 rounded-xl bg-zinc-950/50 border border-amber-950/10">
              
              {/* Level Control */}
              <div className="flex flex-col gap-2">
                <label className="text-xs font-bold text-amber-200/60 uppercase tracking-wider flex justify-between">
                  <span>⭐ Level</span>
                  <span className="text-amber-400">{level}</span>
                </label>
                <input
                  type="range" min="1" max="25" value={level}
                  onChange={e => setLevel(parseInt(e.target.value))}
                  className="accent-amber-500 w-full cursor-pointer h-1.5 bg-zinc-800 rounded-lg appearance-none"
                />
                <span className="text-[10px] text-zinc-500">Unlocks standard and prestige ranks (e.g. King/Queen at level 20)</span>
              </div>

              {/* Gold Coins Control */}
              <div className="flex flex-col gap-2">
                <label className="text-xs font-bold text-amber-200/60 uppercase tracking-wider flex justify-between">
                  <span>🪙 Golds (Coins)</span>
                  <span className="text-amber-400">{golds}</span>
                </label>
                <input
                  type="range" min="0" max="400" step="10" value={golds}
                  onChange={e => setGolds(parseInt(e.target.value))}
                  className="accent-amber-500 w-full cursor-pointer h-1.5 bg-zinc-800 rounded-lg appearance-none"
                />
                <span className="text-[10px] text-zinc-500">Unlocks merchant shop NPCs (e.g. Blacksmith at 200 gold)</span>
              </div>

              {/* Habit Bricks Control */}
              <div className="flex flex-col gap-2">
                <label className="text-xs font-bold text-amber-200/60 uppercase tracking-wider flex justify-between">
                  <span>🧱 Bricks (Streak)</span>
                  <span className="text-amber-400">{bricks}</span>
                </label>
                <input
                  type="range" min="0" max="20" value={bricks}
                  onChange={e => setBricks(parseInt(e.target.value))}
                  className="accent-amber-500 w-full cursor-pointer h-1.5 bg-zinc-800 rounded-lg appearance-none"
                />
                <span className="text-[10px] text-zinc-500">Unlocks consistency combatants (e.g. Archer at 5 bricks)</span>
              </div>

              {/* Honey Focus Control */}
              <div className="flex flex-col gap-2">
                <label className="text-xs font-bold text-amber-200/60 uppercase tracking-wider flex justify-between">
                  <span>🍯 Honey (Focus)</span>
                  <span className="text-amber-400">{honey}</span>
                </label>
                <input
                  type="range" min="0" max="200" step="5" value={honey}
                  onChange={e => setHoney(parseInt(e.target.value))}
                  className="accent-amber-500 w-full cursor-pointer h-1.5 bg-zinc-800 rounded-lg appearance-none"
                />
                <span className="text-[10px] text-zinc-500">Unlocks wizards (e.g. Grand Archmage at 150 points)</span>
              </div>

              {/* StudySync House Toggle */}
              <div className="flex flex-col gap-2">
                <label className="text-xs font-bold text-amber-200/60 uppercase tracking-wider">
                  🏠 StudySync (House)
                </label>
                <select
                  value={studySync}
                  onChange={e => setStudySync(e.target.value)}
                  className="w-full bg-zinc-950 border border-amber-950/40 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:border-amber-500/50"
                >
                  <option value="disconnected">Offline (Disconnected)</option>
                  <option value="connected">Active Sync Room (Connected)</option>
                </select>
                <span className="text-[10px] text-zinc-500">Unlocks wellness characters (e.g. Nun requires connected status)</span>
              </div>

            </div>
          </div>

          {/* Mount the AvatarSelector */}
          <AvatarSelector
            level={level}
            golds={golds}
            habitStreakPoints={bricks}
            focusPoints={honey}
            studySyncStatus={studySync}
            selectedAvatarId={selectedAvatarId}
            onSelect={(avatarId) => {
              console.log("Avatar selected/equipped:", avatarId);
              setSelectedAvatarId(avatarId);
            }}
          />
        </div>
      );
    };

    const container = document.getElementById('demo-root');
    const root = ReactDOM.createRoot(container);
    root.render(<DemoApp />);
  </script>
</body>
</html>
